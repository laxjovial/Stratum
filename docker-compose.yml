version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: stratum_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stratum_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stratum_password}
      POSTGRES_DB: ${POSTGRES_DB:-stratum_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-stratum_user} -d $${POSTGRES_DB:-stratum_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stratum_network

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: stratum_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-stratum_user}:${POSTGRES_PASSWORD:-stratum_password}@postgres:5432/${POSTGRES_DB:-stratum_db}
      - RAG_SERVICE_URL=http://rag_service:8001
      - FIREBASE_CONFIG=${FIREBASE_CONFIG}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stratum_network

  rag_service:
    build:
      context: ./packages/services/rag_pipeline
      dockerfile: Dockerfile
    container_name: stratum_rag_service
    ports:
      - "8001:8001"
    environment:
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    networks:
      - stratum_network

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: stratum_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - stratum_network

networks:
  stratum_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
